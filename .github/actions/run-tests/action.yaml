name: 'Run tests'
description: 'Runs Cypress tests for service'

inputs:
  path:
    required: true
    description: 'Path to service folder'

runs:
  using: composite
  steps:
    - name: Install root packages
      shell: bash
      run: npm ci

    - name: Install service packages
      shell: bash
      working-directory: ${{ inputs.path }}
      run: npm ci

    - name: Lint files
      shell: bash
      run: npm run eslint -- ${{ inputs.path }}

    - name: Run tests
      shell: bash
      run: npm test --prefix ${{ inputs.path }}
