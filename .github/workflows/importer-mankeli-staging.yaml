name: importer-mankeli-staging

on:
  push:
    branches:
      - master
    paths:
      - importer-mankeli/**
      - .npmrc
      - .github/workflows/importer-mankeli-staging.yaml
      - docker-compose.ci.yml

jobs:
  build_and_push_anon_sis_importer_db:
    name: 'Build anon sis-importer-db and push to toska hub if new migrations have been added'
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'renovate[bot]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: check_migrations
        with:
          filters: |
            migrations:
              - 'importer-mankeli/src/db/migrations/**'
              - '.github/workflows/importer-mankeli-staging.yaml'
      - name: 'Login to version helsinki registry'
        uses: docker/login-action@v3
        with:
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}
      - name: 'Let importer-mankeli run migrations, then push new version of image to toska hub'
        if: steps.check_migrations.outputs.migrations == 'true'
        run: |
          docker compose --file docker-compose.ci.yml up --detach importer-mankeli
          sleep 40 # wait for importer-mankeli to start and run migrations
          docker commit sis-importer-db registry.version.helsinki.fi/toska/openshift/kontit/sis-importer-db
          docker push registry.version.helsinki.fi/toska/openshift/kontit/sis-importer-db

  test:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'renovate[bot]' }}

    needs:
      - build_and_push_anon_sis_importer_db

    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          path: importer-mankeli

  build-and-push-version:
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ github.actor != 'renovate[bot]' }}

    steps:
      - uses: actions/checkout@v4
      - name: Build and push image
        uses: ./.github/actions/build-and-push-image
        with:
          image: importer-mankeli
          tag: staging
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}
